name: Build, Test, and Release

on:
  push:
    paths-ignore:
      - "**.md"
      - "website/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-experimental-features = nix-command flakes ca-derivations
            download-buffer-size = 524288000

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: indigo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        continue-on-error: true

      - name: Check Fourmolu formatting
        run: nix shell nixpkgs#fourmolu --command fourmolu --mode check $(git ls-files '*.hs')

      - name: Run HLint
        run: nix shell nixpkgs#hlint --command hlint lib/ app/ tests/ lsp/src/ lsp/tests/

  build_and_test:
    name: Build & Test Native (Compiler & LSP)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-experimental-features = nix-command flakes ca-derivations
            download-buffer-size = 524288000

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: indigo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        continue-on-error: true

      - name: Build and test Indigo compiler
        run: nix build .#indigo --out-link result-indigo

      - name: Build Indigo LSP
        run: nix build .#indigo-lsp --out-link result-lsp

      - name: Prepare native release package
        run: |
          mkdir -p indigo-latest
          cp result-indigo/bin/indigo indigo-latest/
          chmod +x indigo-latest/indigo
          cp result-lsp/bin/indigo-lsp indigo-latest/
          chmod +x indigo-latest/indigo-lsp
          cp -r share/std indigo-latest/
          zip -r indigo-release-latest.zip indigo-latest

      - name: Upload native release artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-native-release
          path: indigo-release-latest.zip
          retention-days: 7

  build_wasm:
    name: Build WASM Reactor
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-experimental-features = nix-command flakes ca-derivations impure-derivations
            download-buffer-size = 524288000

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: indigo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        continue-on-error: true

      - name: Update ghc-wasm-meta input
        run: nix flake lock --update-input ghc-wasm-meta

      - name: Build WASM reactor with Nix
        run: nix build .#build-wasm-reactor --impure --extra-experimental-features "nix-command flakes ca-derivations impure-derivations"

      - name: Prepare WASM release package
        run: |
          mkdir -p indigo-wasm-latest
          cp result/indigo-init.wasm indigo-wasm-latest/indigo-init.wasm
          cp -r share/std indigo-wasm-latest/
          zip -r indigo-wasm-latest.zip indigo-wasm-latest

      - name: Upload WASM release artifact
        uses: actions/upload-artifact@v4
        with:
          name: indigo-wasm-release
          path: indigo-wasm-latest.zip
          retention-days: 7

  release:
    name: Create Releases
    runs-on: ubuntu-latest
    needs: [lint, build_and_test, build_wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download native release artifact
        uses: actions/download-artifact@v4
        with:
          name: indigo-native-release

      - name: Download WASM release artifact
        uses: actions/download-artifact@v4
        with:
          name: indigo-wasm-release

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Upload WASM zip to Google Cloud Storage
        run: |
          gcloud storage cp indigo-wasm-latest.zip gs://indigolang/indigo-wasm-latest.zip
